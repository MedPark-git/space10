{% extends 'base.html' %}{% block page_title %}{{ '품목 수정' if item else '품목 등록' }}{% endblock %}{% block content %}<section class="panel form-panel"><form method="post" class="form-grid submit-lock"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>품목코드<input name="code" value="{{ item.code if item else '' }}" {{ 'readonly' if item }} required></label><label>품목명<input name="name" value="{{ item.name if item else '' }}" required></label><label>분류<input name="category" value="{{ item.category or '' if item else '' }}"></label><label>단위<input name="unit" value="{{ item.unit if item else 'EA' }}" required></label><label>보관 위치<input name="location" value="{{ item.location or '' if item else '' }}"></label><label>안전재고<input type="number" min="0" step="0.001" name="safety_stock" value="{{ item.safety_stock if item else 0 }}" required></label><label>단가<input type="number" min="0" step="0.01" name="unit_cost" value="{{ item.unit_cost if item else 0 }}" required></label><div class="actions"><a class="button" href="{{ url_for('items') }}">취소</a><button class="primary" type="submit">저장</button></div></form></section>{% endblock %}
