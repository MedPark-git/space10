<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 재고현황 및 재고분석</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head><body class="login-page"><section class="login-panel"><div class="login-copy"><span class="eyebrow">MEDPARK INTERNAL SYSTEM</span><h1>재고의 흐름을<br>한눈에 관리합니다.</h1><p>품목별 현재고와 입출고 이력을 확인하고<br>안전재고 위험을 빠르게 파악하세요.</p></div><form class="login-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="brand login-brand"><span class="brand-mark">M</span><div><strong>재고현황 및 재고분석</strong><small>INVENTORY MANAGEMENT</small></div></div><h2>로그인</h2>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="toast {{ category }}">{{ message }}</div>{% endfor %}<label>아이디<input name="login_id" autocomplete="username" required autofocus></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label><button class="primary full" type="submit">로그인</button><small class="help">계정 문의는 시스템 관리자에게 연락해 주세요.</small></form></section></body></html>
