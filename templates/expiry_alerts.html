{% extends 'base.html' %}{% block page_title %}유효기간 알림 기준{% endblock %}{% block content %}<section class="card"><h1>유효기간 알림 기준</h1><p>평가일 기준 잔여일이 입력한 일수 미만인 재고를 현황에서 구분합니다. 이메일·메신저 발송은 연결되어 있지 않습니다.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="expiry-filters">{% for d in days %}<label>{{ loop.index }}차 기준 (일)<input type="number" name="day{{ loop.index }}" min="1" max="3650" value="{{ d }}" required></label>{% endfor %}</div><button class="btn primary">저장</button><a class="btn" href="{{ url_for('expiry.index') }}">현황으로</a></form></section>{% endblock %}
